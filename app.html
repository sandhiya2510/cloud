<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Attendance Portal</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 100px;
            background-color: white;
        }
        h1 {
            font-size: 36px;
        }
        p {
            font-size: 20px;
        }
        button {
            padding: 12px 25px;
            font-size: 18px;
            cursor: pointer;
            margin: 10px;
        }
        #message {
            color: green;
            font-size: 24px;
            font-weight: bold;
            margin-top: 30px;
        }
        #logoutBtn {
            display: none;
        }
    </style>
</head>
<body>
    <h1>Student Attendance Portal</h1>
    <p id="welcome">Welcome to the Student Attendance Portal</p>
    <button id="loginBtn" onclick="login()">
        Login with Auth0
    </button>
    <h2 id="message"></h2>
    <button id="logoutBtn" onclick="logout()">
        Logout
    </button>
    <script>
        const domain = "dev-k0bha7dok62im6d7.us.auth0.com";
        const clientId = "2kVHNKKdL3TEIHZZc5JBHHJepvobiqUi";
        const redirectUri = "http://localhost:5500/app.html";
        const params = new URLSearchParams(
            window.location.search
        );
        const message = document.getElementById("message");
        const welcome = document.getElementById("welcome");
        const loginBtn = document.getElementById("loginBtn");
        const logoutBtn = document.getElementById("logoutBtn");
        if (params.has("error")) {
            message.style.color = "red";
            message.innerText =
                "Authorization Failed: " +
                (params.get("error_description") ||
                 params.get("error"));
        } else if (params.has("code")) {
            message.innerText = "Authorization Successful!";
            welcome.innerText = "Welcome !";
            loginBtn.style.display = "none";
            logoutBtn.style.display = "inline-block";
            window.history.replaceState(
                {},
                document.title,
                window.location.pathname
            );
        }
        function login() {
            const authUrl =
                "https://" + domain + "/authorize" +
                "?client_id=" + encodeURIComponent(clientId) +
                "&response_type=code" +
                "&scope=" + encodeURIComponent(
                    "openid profile email"
                ) +
                "&redirect_uri=" + encodeURIComponent(
                    redirectUri
                );
            window.location.href = authUrl;
        }
        function logout() {
            window.location.href =
                "https://" + domain + "/v2/logout" +
                "?client_id=" + encodeURIComponent(clientId) +
                "&returnTo=" + encodeURIComponent(
                    redirectUri
                );
        }
    </script>
</body>
</html>
